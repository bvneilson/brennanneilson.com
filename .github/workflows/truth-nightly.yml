name: truth-nightly

on:
  schedule:
    - cron: '37 9 * * *'
  workflow_dispatch:
    inputs:
      simulate_report_failure:
        description: 'Demo only: force the report build to fail (manual runs only)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: truth-nightly
  cancel-in-progress: false

jobs:
  walk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SITE_URL: ${{ vars.SITE_URL }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Claim-walks
        id: walk
        continue-on-error: true
        run: npx playwright test --trace off

      # Builds into a temp file and moves it into place only when it is valid, so a failed build
      # never leaves a truncated results.json behind.
      - name: Build results.json
        id: build
        if: always()
        env:
          SIMULATE_FAILURE: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_report_failure }}
        run: |
          set -euo pipefail
          report=truth/out/report.json
          if [ "$SIMULATE_FAILURE" = true ]; then report=truth/out/does-not-exist.json; fi
          tmp="$(mktemp)"
          node truth/report.ts "$report" > "$tmp"
          jq -e '.results | length > 0' "$tmp" > /dev/null
          mv "$tmp" truth/out/results.json

      - name: Publish results.json to truth-results
        if: always() && steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          cp truth/out/results.json "$dir/results.json"
          cd "$dir"
          git init -q -b truth-results
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results.json
          git commit -q -m "truth results $(date -u +%Y-%m-%dT%H:%MZ)"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic ${auth}" \
            push --force "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" truth-results

      - name: Open or close a truth-failure issue per slug
        if: always() && steps.build.outcome == 'success'
        run: |
          set -uo pipefail
          gh label create truth-failure --color B60205 --description 'A claim-walk or review check is failing' 2>/dev/null || true
          open_issue() { # title -> number or empty
            gh issue list --label truth-failure --state open --limit 200 --json number,title \
              | jq -r --arg t "$1" '.[] | select(.title == $t) | .number' | head -n 1
          }
          # Explicit `|| return 1` on every call: this runs under `||`, where set -e is ignored.
          handle_slug() { # slug status
            local slug="$1" status="$2" num body
            local title="Truth walk failing: ${slug}"
            num="$(open_issue "$title")" || return 1
            if [ "$status" = fail ]; then
              body="The nightly claim-walk for \`${slug}\` failed. Run: ${RUN_URL}"
              if [ -n "$num" ]; then
                gh issue comment "$num" --body "Still failing. ${body}" || return 1
              else
                gh issue create --label truth-failure --title "$title" --body "$body" || return 1
              fi
            elif [ -n "$num" ]; then
              gh issue close "$num" --comment "Passing again. Run: ${RUN_URL}" || return 1
            fi
          }
          failed=0
          rows="$(jq -r '.results[] | [.slug, .status] | @tsv' truth/out/results.json)" || exit 1
          while IFS=$'\t' read -r slug status; do
            handle_slug "$slug" "$status" || { echo "::warning::issue handling failed for ${slug}"; failed=1; }
          done <<< "$rows"
          # The report built, so a previous "nightly broken" issue is resolved.
          broken="$(open_issue 'Truth nightly broken')" || { echo '::warning::could not look up the broken-nightly issue'; failed=1; broken=''; }
          if [ -n "$broken" ]; then
            gh issue close "$broken" --comment "Report builds again. Run: ${RUN_URL}" \
              || { echo '::warning::could not close the broken-nightly issue'; failed=1; }
          fi
          exit "$failed"

      # The report build failed: results.json is not published (the last good one stays) and
      # the COO gets one issue to fix it.
      - name: Open a Truth nightly broken issue
        if: always() && steps.build.outcome == 'failure'
        run: |
          set -euo pipefail
          gh label create truth-failure --color B60205 --description 'A claim-walk or review check is failing' 2>/dev/null || true
          title='Truth nightly broken'
          num="$(gh issue list --label truth-failure --state open --limit 200 --json number,title \
            | jq -r --arg t "$title" '.[] | select(.title == $t) | .number' | head -n 1)"
          body="The nightly could not build results.json, so truth-results was left unchanged. Run: ${RUN_URL}"
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "Still broken. ${body}"
          else
            gh issue create --label truth-failure --title "$title" --body "$body"
          fi

      - name: Resume review check
        if: always()
        run: |
          set -euo pipefail
          gh label create truth-failure --color B60205 --description 'A claim-walk or review check is failing' 2>/dev/null || true
          state="$(node scripts/resume-check.ts)"
          echo "resume freshness: ${state}"
          title='Resume review due'
          num="$(gh issue list --label truth-failure --state open --limit 200 --json number,title \
            | jq -r --arg t "$title" '.[] | select(.title == $t) | .number' | head -n 1)"
          case "$state" in
            review-due|hidden)
              if [ -z "$num" ]; then
                gh issue create --label truth-failure --title "$title" \
                  --body "Resume freshness is \`${state}\`. Diff against the source resume, re-scrub, and bump reviewedAt only in that PR. Run: ${RUN_URL}"
              fi ;;
            *)
              if [ -n "$num" ]; then gh issue close "$num" --comment "Resume freshness is \`${state}\`."; fi ;;
          esac

      - name: Fail the run if any walk failed
        if: always() && steps.walk.outcome == 'failure'
        run: |
          echo 'One or more claim-walks failed. See the truth-failure issues.'
          exit 1
